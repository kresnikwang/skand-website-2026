# Insert into the skandstudio.com HTTPS server after defining the rate zone
# at http scope: limit_req_zone $binary_remote_addr zone=skand_wechat_rate:1m rate=10r/s;
location = /api/wechat/signature {
    limit_req zone=skand_wechat_rate burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 5s;
    proxy_cache off;
}
