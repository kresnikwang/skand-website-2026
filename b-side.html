<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKAND — B-Side: Form the Mark</title>
<meta name="description" content="SKAND B-Side: gather a cloud of particles and form the SKAND mark in Three.js.">
<link rel="canonical" href="https://skandstudio.com/b-side.html">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="stylesheet" href="fonts/local-fonts.css">
<style>
:root {
  --black: #0a0a0a;
  --dark: #131313;
  --panel: rgba(14, 14, 14, 0.82);
  --white: #f0ede8;
  --muted: rgba(240, 237, 232, 0.56);
  --line: rgba(240, 237, 232, 0.14);
  --coral: #e8563a;
  --blue: #4052b5;
  --green: #7bbf9c;
  --font-body: 'Outfit', 'Helvetica Neue', sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--black);
}

body {
  color: var(--white);
  font-family: var(--font-body);
  font-weight: 300;
  overflow: hidden;
  cursor: auto;
}

button, a { font: inherit; }
button { cursor: pointer; }
html.custom-cursor-enabled body,
html.custom-cursor-enabled button,
html.custom-cursor-enabled a { cursor: none; }

.grain {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  opacity: 0.018;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.cursor-dot, .cursor-ring {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  mix-blend-mode: difference;
  opacity: 0;
}
html.custom-cursor-enabled .cursor-dot,
html.custom-cursor-enabled .cursor-ring { opacity: 1; }
.cursor-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--coral);
}
.cursor-ring {
  width: 42px; height: 42px; border: 1.5px solid var(--white); border-radius: 50%;
  transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease;
}
.cursor-ring.hovering {
  width: 58px; height: 58px; border-color: var(--coral);
}

/* The shell fades/settles in on load, same as before. */
.b-side-shell {
  position: fixed;
  inset: 0;
  opacity: 0;
  transform: rotateY(12deg) scale(0.985);
  transform-origin: center;
  transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.b-side-shell.ready { opacity: 1; transform: rotateY(0deg) scale(1); }
html.custom-cursor-enabled .b-side-shell.is-live { cursor: none; }

#glCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  display: block;
}

/* On reveal, ease the whole scene forward a touch. */
.b-side-shell.is-revealed #glCanvas {
  animation: revealSettle 1.2s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes revealSettle {
  0% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 40px;
  mix-blend-mode: difference;
}
.nav-logo {
  display: inline-flex; align-items: center; gap: 14px;
  color: var(--white); text-decoration: none;
}
.nav-logo img { height: 28px; filter: invert(1); }
.page-mark {
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
}
.back-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 0 16px;
  border: 1px solid rgba(240, 237, 232, 0.32);
  border-radius: 4px;
  background: transparent; color: var(--white); text-decoration: none;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}
.back-btn:hover { border-color: var(--coral); background: var(--coral); color: var(--black); }

/* ---- intro ---- */
.intro {
  position: fixed; inset: 0; z-index: 30;
  display: grid; place-items: center;
  background: rgba(10, 10, 10, 0.64);
  transition: opacity 0.7s ease;
}
.intro.is-hidden { opacity: 0; pointer-events: none; }
.intro-inner { display: grid; justify-items: center; gap: 18px; padding: 24px; }
.intro-title {
  font-size: clamp(42px, 9vw, 126px); font-weight: 800; line-height: 0.86;
  letter-spacing: clamp(8px, 1.8vw, 24px);
}
.intro-kicker { color: var(--muted); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.start-btn {
  min-height: 40px; margin-top: 14px; padding: 0 18px;
  border: 1px solid rgba(240, 237, 232, 0.28); border-radius: 4px;
  background: var(--white); color: var(--black);
  font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease, background 0.25s ease;
  pointer-events: none;
}
.start-btn.ready { opacity: 1; transform: translateY(0); pointer-events: auto; }
.start-btn:hover { background: var(--coral); }

/* ---- hint ---- */
.hint {
  position: fixed;
  left: 50%;
  bottom: 112px;
  z-index: 22;
  transform: translateX(-50%);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease, color 0.4s ease, letter-spacing 0.6s ease;
}
.hud.visible ~ .hint { opacity: 1; }
.hint.is-revealed { color: var(--coral); letter-spacing: 5px; }
.hint.is-error { color: var(--coral); }

/* ---- HUD ---- */
.hud {
  position: fixed;
  left: 50%; bottom: 32px;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: center;
  gap: 13px;
  width: min(610px, calc(100vw - 48px));
  padding: 0;
  opacity: 0;
  transform: translate(-50%, 12px);
  pointer-events: none;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.hud.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.b-side-shell.is-revealed .hud { opacity: 0; pointer-events: none; }

.charge-block { display: grid; gap: 9px; }
.charge-label {
  display: flex; justify-content: space-between; align-items: baseline;
  color: var(--muted); font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
}
.charge-pct { color: var(--white); font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.charge-track {
  position: relative;
  height: 2px;
  border-radius: 2px;
  background: rgba(240, 237, 232, 0.12);
  overflow: hidden;
}
.charge-fill {
  position: absolute; inset: 0;
  transform-origin: left center;
  transform: scaleX(0);
  border-radius: 2px;
  background: linear-gradient(90deg, var(--blue), var(--coral) 70%, var(--white));
  box-shadow: 0 0 14px rgba(232, 86, 58, 0.55);
  transition: transform 0.12s linear;
}

.phase-row {
  grid-column: 1 / -1;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.phase-step {
  display: inline-flex; align-items: center; gap: 7px;
  color: rgba(240, 237, 232, 0.4);
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  transition: color 0.35s ease;
}
.phase-step b {
  display: inline-grid; place-items: center;
  width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid currentColor;
  font-size: 9px; font-weight: 600; letter-spacing: 0;
}
.phase-step.is-done { color: var(--muted); }
.phase-step.is-active { color: var(--coral); }
.phase-step.is-active b { box-shadow: 0 0 12px rgba(232, 86, 58, 0.6); }

.utility {
  position: fixed; top: 88px; right: 40px; z-index: 24;
  display: flex; align-items: center; gap: 6px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}

/* ---- mode switch (Gather / Squeeze) ----
   The two games share one mark, so the switch is a segmented control rather
   than two links: the point is that you are choosing how to play with the
   same thing.

   Top-centred, NOT above the HUD: the bottom of this screen is already three
   stacked things (hint, charge bar, phase steps) and the hint is centred, so
   anything else centred down there collides with it. The top band is free
   because the nav only occupies its left and right thirds. */
.mode-switch {
  position: fixed;
  left: 50%;
  top: 30px;
  z-index: 21;
  display: flex;
  gap: 2px;
  padding: 2px;
  transform: translateX(-50%);
  border: 1px solid var(--line);
  border-radius: 100px;
  background: rgba(10, 10, 10, 0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.b-side-shell.is-live .mode-switch { opacity: 1; pointer-events: auto; }
.mode-btn {
  min-height: 30px;
  padding: 0 16px;
  border: 0;
  border-radius: 100px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: color 0.25s ease, background 0.25s ease;
}
.mode-btn:hover { color: var(--white); }
.mode-btn.is-active { background: var(--white); color: var(--black); }

/* ---- pop counter (squeeze mode only) ----
   Deliberately not a score. A pop is not skill, it is a thing the visitor did
   to the mark, and the counter is there to make them want to do it again.
   Tucked under the mode switch it belongs to, rather than competing with the
   centred hint line further down. */
.pops-block {
  position: fixed;
  left: 50%;
  top: 78px;
  z-index: 21;
  display: flex;
  align-items: baseline;
  gap: 10px;
  transform: translateX(-50%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.pops-block[hidden] { display: none; }
.b-side-shell.is-live .pops-block:not([hidden]) { opacity: 1; }
.pops-label {
  color: rgba(240, 237, 232, 0.35);
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}
.pops-count {
  color: var(--white);
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
}
.b-side-shell.is-live .utility { opacity: 1; pointer-events: auto; }
.icon-btn {
  width: 40px; height: 40px;
  border: 1px solid var(--line); border-radius: 4px;
  background: transparent; color: var(--white);
  font-size: 16px; line-height: 1;
  transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.icon-btn:hover, .icon-btn.is-active {
  border-color: var(--coral); background: rgba(232, 86, 58, 0.14); color: var(--coral);
}
.impact-flash {
  position: fixed; inset: 0; z-index: 12;
  pointer-events: none; opacity: 0; background: var(--white);
}
.b-side-shell.is-revealed .impact-flash {
  animation: impactFlash 0.72s ease-out both;
}
@keyframes impactFlash {
  0% { opacity: 0; }
  9% { opacity: 0.32; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}

/* Squeeze mode's pop. Harder and shorter than the reveal flash — this is a
   detonation, not an ignition — and tinted coral so it is distinguishable from
   Gather's white flash even at a glance. */
.b-side-shell.is-popped .impact-flash {
  animation: popFlash 0.5s ease-out both;
}
@keyframes popFlash {
  0% { opacity: 0; background: var(--coral); }
  6% { opacity: 0.62; }
  22% { opacity: 0.12; background: var(--white); }
  60% { opacity: 0; }
  100% { opacity: 0; }
}

@media (pointer: coarse), (max-width: 768px) {
  html.custom-cursor-enabled body { cursor: auto; }
  html.custom-cursor-enabled button, html.custom-cursor-enabled a { cursor: pointer; }
  .cursor-dot, .cursor-ring { display: none; }
  nav { padding: 18px; }
  .page-mark { display: none; }
  .back-btn { min-height: 40px; padding: 0 12px; font-size: 10px; }
  .hint { bottom: 112px; font-size: 10px; letter-spacing: 2px; }
  .hud {
    bottom: 24px;
    width: min(420px, calc(100vw - 24px));
  }
  .phase-step span { display: none; }
  .mode-switch { top: 20px; }
  .mode-btn { padding: 0 13px; letter-spacing: 1.5px; }
  .pops-block { top: 64px; }
  .utility { top: 72px; right: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .b-side-shell, .start-btn, .hud, .hint, .back-btn, .icon-btn, .utility { transition-duration: 0.01ms; }
  .b-side-shell.is-revealed #glCanvas { animation: none; }
  .b-side-shell.is-revealed .impact-flash { animation: none; }
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="b-side-shell" id="bSideShell">
  <canvas id="glCanvas"></canvas>
  <div class="impact-flash" aria-hidden="true"></div>

  <nav>
    <a class="nav-logo" href="index.html" aria-label="SKAND home">
      <img src="logo.png" alt="SKAND">
      <span class="page-mark">B-Side</span>
    </a>
    <a href="index.html" class="back-btn" id="backBtn">Back</a>
  </nav>

  <div class="hud" id="hud">
    <div class="charge-block">
      <div class="charge-label">
        <span id="chargeLabel">Charge</span>
        <span class="charge-pct" id="chargePct">0%</span>
      </div>
      <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
    </div>
    <div class="phase-row" id="phaseRow"></div>
  </div>

  <!-- Mode switch. Two games on one mark: gather assembles it, squeeze takes it
       apart. Sits above the HUD so it never competes with the charge bar. -->
  <div class="mode-switch" id="modeSwitch" role="group" aria-label="Game">
    <button class="mode-btn is-active" id="modeGatherBtn" aria-pressed="true">Gather</button>
    <button class="mode-btn" id="modeSqueezeBtn" aria-pressed="false">Squeeze</button>
  </div>

  <div class="pops-block" id="popsBlock" hidden>
    <span class="pops-label" id="popsLabel">Pops</span>
    <span class="pops-count" id="popsCount">00</span>
  </div>

  <div class="utility">
    <button class="icon-btn is-active" id="soundBtn" aria-label="Sound" title="Sound">♪</button>
    <button class="icon-btn" id="resetBtn" aria-label="Reset" title="Reset">↺</button>
  </div>

  <div class="hint" id="hint"></div>
</div>

<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-title">SKAND</div>
    <div class="intro-kicker" id="introKicker">B-Side — Form the Mark</div>
    <button class="start-btn" id="startBtn">Start</button>
  </div>
</div>

<script type="module" src="scripts/bside/main.js?v=20260929b"></script>
</body>
</html>
